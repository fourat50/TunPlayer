name: Windows installer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'packaging/windows/**'
      - 'scripts/build_windows.py'
      - 'scripts/verify_windows.py'
      - 'scripts/publish_windows.py'
      - 'tunplayer/**'
      - 'assets/**'
      - 'run.py'
      - 'tests/test_platform_support.py'
      - 'tests/test_windows_packaging.py'
  workflow_dispatch:
    inputs:
      publish:
        description: Ajouter l'installateur verifie a la release existante
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            ca-certificates
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-nsis
      - name: Portable policies and actual mpv decoder
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_playback_ui.py -v
          python -m unittest discover -s tests -p test_playback_flow.py -v
          python -m unittest discover -s tests -p test_player.py -v
          python -m unittest discover -s tests -p test_player_catalog.py -v
          python -m unittest discover -s tests -p test_platform_support.py -v
          python -m unittest discover -s tests -p test_windows_packaging.py -v
      - name: Build standalone application and installer
        shell: msys2 {0}
        run: python scripts/build_windows.py
      - name: Install, launch relocated EXE, verify embedded video, uninstall
        shell: msys2 {0}
        run: python scripts/verify_windows.py dist/TunPlayer-1.0.0-windows-x64-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/TunPlayer-*-windows-x64-setup.exe
            dist/Windows-SHA256SUMS
            dist/Windows-README.md
            dist/windows-verification.json
            dist/windows-verification.png
  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: dist
      - name: Publish Windows assets without replacing Linux files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_windows.py --expected-commit "$GITHUB_SHA"
